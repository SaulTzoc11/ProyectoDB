# Detrás de Traefik (Dokploy) o del Ingress (Kubernetes) el TLS termina antes de
# llegar aquí: se reenvía el esquema original (https) para que Django lo reconozca.
map $http_x_forwarded_proto $esquema_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    location = /salud-web {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    root /usr/share/nginx/html;
    index index.html;

    ssi on;
    ssi_types text/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_original;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
