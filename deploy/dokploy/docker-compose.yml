# PRODUCCIÓN con Dokploy (Opción B: Docker simple).
#
# En Dokploy: Create Service -> Compose -> tipo "Stack" (Docker Swarm), repositorio
# de GitHub, rama main, Compose Path: ./deploy/dokploy/docker-compose.yml.
# Las variables (${...}) se cargan en la pestaña Environment (ver docs/DEVOPS.md).
# Dominios (HTTPS con Let's Encrypt) en la pestaña Domains:
#   - servicio "web", puerto 80          -> sapo.tudominio.com
#   - servicio "uptime-kuma", puerto 3001 -> estado.tudominio.com
#
# Persistencia: volumen "datos_sqlserver".  Sin tiempo de inactividad: api y web
# arrancan la tarea nueva, esperan a que pase el healthcheck y luego apagan la vieja.
version: "3.8"

x-entorno-api: &entorno-api
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DOMINIO},localhost,127.0.0.1
  DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMINIO}
  DJANGO_COOKIES_SEGURAS: "1"
  DJANGO_PROXY_SSL: "1"
  DB_NAME: PintureriaDB
  DB_HOST: db
  DB_PORT: "1433"
  DB_USER: app_django
  DB_PASSWORD: ${DB_PASSWORD}
  DB_DRIVER: ODBC Driver 18 for SQL Server
  DB_EXTRA_PARAMS: TrustServerCertificate=yes
  DESCUENTO_CLAVE: ${DESCUENTO_CLAVE}

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - datos_sqlserver:/var/opt/mssql
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      replicas: 1
      update_config:
        order: stop-first        # dos SQL Server no pueden usar el mismo volumen
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 2G

  # Corre en cada despliegue: crea/migra la base y termina.
  migrador:
    image: ${DOCKERHUB_USUARIO}/sapo-pinturas-api:latest
    command: ["python", "manage.py", "inicializar_bd", "--espera", "300"]
    environment:
      <<: *entorno-api
      DB_ADMIN_USER: sa
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      GERENTE_USUARIO: ${GERENTE_USUARIO:-gerente}
      GERENTE_CONTRASENA: ${GERENTE_CONTRASENA}
    networks: [interna]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 10

  api:
    image: ${DOCKERHUB_USUARIO}/sapo-pinturas-api:latest
    environment: *entorno-api
    networks: [interna]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/salud/bd/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
      rollback_config:
        order: start-first
      restart_policy:
        condition: any

  web:
    image: ${DOCKERHUB_USUARIO}/sapo-pinturas-web:latest
    networks: [interna, dokploy-network]
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: any

  # Monitoreo básico: disponibilidad de la página y del endpoint de salud.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - datos_uptime:/app/data
    networks: [dokploy-network]
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  interna:
    driver: overlay
  dokploy-network:
    external: true

volumes:
  datos_sqlserver:
  datos_uptime:
