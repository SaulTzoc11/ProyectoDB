<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes | Sapo Pinturas</title>
  <link rel="icon" type="image/png" href="/assets/logo-sapo-pinturas.png">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/pages/reportes.css">
</head>
<body class="app-view cargando" data-seccion="reportes">
  <!--# include virtual="/partials/barra-lateral.html" -->

  <div class="app-shell">
    <header class="topbar">
      <button type="button" class="menu-button" data-accion="abrir-menu" aria-label="Abrir menú">&#9776;</button>
      <div>
        <p class="eyebrow">SAPO PINTURAS</p>
        <h1>Reportes</h1>
      </div>
      <!--# include virtual="/partials/acciones-usuario.html" -->
    </header>

    <main class="content">
      <div class="section-heading">
        <div>
          <h2>Reportes gerenciales</h2>
          <p>Ventas, compras, inventario y comportamiento de los productos.</p>
        </div>
        <button type="button" class="action-button" id="imprimir">Imprimir</button>
      </div>

      <nav class="report-tabs" id="pestanas" aria-label="Reportes disponibles"></nav>

      <section class="workspace-card">
        <h3 id="tituloReporte"></h3>
        <p class="muted" id="descripcionReporte"></p>

        <form class="report-filters" id="filtros" novalidate>
          <div data-filtro="desde">
            <label for="f_desde">Desde</label>
            <input id="f_desde" name="desde" type="date">
          </div>
          <div data-filtro="hasta">
            <label for="f_hasta">Hasta</label>
            <input id="f_hasta" name="hasta" type="date">
          </div>
          <div data-filtro="top">
            <label for="f_top">Filas a mostrar</label>
            <input id="f_top" name="top" type="number" min="1" max="500" value="10">
          </div>
          <div data-filtro="noFactura">
            <label for="f_factura">Número de factura</label>
            <input id="f_factura" name="noFactura" maxlength="50" autocomplete="off">
          </div>
          <button type="submit" class="action-button green">Consultar</button>
        </form>

        <p class="error" id="errorReporte" role="alert"></p>
        <div id="resultado"></div>
      </section>
    </main>
  </div>

  <!--# include virtual="/partials/pie-pagina.html" -->
  <script type="module" src="/js/paginas/reportes.js"></script>
</body>
</html>
