services:
  db:
    profiles: ["bd-local"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:-Pintureria#2026Sa}
    ports:
      - "1433:1433"
    volumes:
      - datos_sqlserver:/var/opt/mssql
      - ./:/backup:ro

  api:
    build: ./backend
    env_file: .env
    expose:
      - "8000"
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  datos_sqlserver:
